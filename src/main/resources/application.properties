spring.application.name=tryal

# postgresql
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tryal_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# jpa/hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

#create : drops and recreates schema every time you start
#create-drop : same as above, but also drops it on shutdown
#update : updates schema without dropping (careful in prod)
#none : disables schema generation
spring.jpa.hibernate.ddl-auto=create-drop

# Defer force initalize after schema is made.
#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always

# spring security
spring.security.user.name=${ADMIN_USERNAME:burrito}
spring.security.user.password=${ADMIN_USERNAME:boys}

# environment
spring.application.environment=${ENV:dev}

# redis
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=${REDIS_PASSWORD:password}
spring.redis.database=0

# JWT configuration
app.jwt.expiration=3600000
app.jwt.refresh-expiration=2592000000

